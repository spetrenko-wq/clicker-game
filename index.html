<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Міні-гра Клацалка</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .dashboard {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .info-box {
      background: white;
      padding: 10px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    #game-area {
      position: relative;
      width: 600px;
      height: 400px;
      background-color: #ffffff;
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    #target {
      position: absolute;
      width: 50px;
      height: 50px;
      background-color: #ff4757;
      border: 3px solid #2ed573;
      border-radius: 50%;
      display: none; /* Сховано до початку гри */
      transition: transform 0.1s ease;
    }

    #target:active {
      transform: scale(0.9);
    }

    .instructions {
      margin-top: 15px;
      color: #666;
      font-size: 0.95rem;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="info-box">Рахунок: <span id="score">0</span></div>
    <div class="info-box">Час: <span id="timer">30</span>с</div>
    <div class="info-box">Рекорд: <span id="high-score">0</span></div>
  </div>

  <div id="game-area">
    <div id="target"></div>
    <div id="overlay">Натисніть ПРОБІЛ для старту</div>
  </div>

  <div class="instructions">
    * Натискайте <b>Пробіл</b>, щоб почати або поставити на паузу.
  </div>

  <script>
    const gameArea = document.getElementById('game-area');
    const target = document.getElementById('target');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const highScoreEl = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');

    let score = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let isRunning = false;
    let highScore = localStorage.getItem('clicker_high_score') || 0;

    highScoreEl.textContent = highScore;

    // Зміна позиції мішені
    function moveTarget() {
      const maxX = gameArea.clientWidth - target.clientWidth;
      const maxY = gameArea.clientHeight - target.clientHeight;

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      target.style.left = `${randomX}px`;
      target.style.top = `${randomY}px`;
    }

    // Початок гри
    function startGame() {
      isRunning = true;
      overlay.style.display = 'none';
      target.style.display = 'block';

      if (timeLeft === 0 || timeLeft === 30) {
        score = 0;
        timeLeft = 30;
        scoreEl.textContent = score;
        timerEl.textContent = timeLeft;
        moveTarget();
      }

      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    // Пауза
    function pauseGame() {
      isRunning = false;
      clearInterval(timerInterval);
      overlay.textContent = 'Пауза (Натисніть ПРОБІЛ)';
      overlay.style.display = 'flex';
      target.style.display = 'none';
    }

    // Завершення гри
    function endGame() {
      isRunning = false;
      clearInterval(timerInterval);
      target.style.display = 'none';

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('clicker_high_score', highScore);
        highScoreEl.textContent = highScore;
        overlay.textContent = `Новий рекорд: ${score}! (ПРОБІЛ - грати знову)`;
      } else {
        overlay.textContent = `Гра закінчена! Ваш результат: ${score} (ПРОБІЛ - спробувати знову)`;
      }

      overlay.style.display = 'flex';
    }

    // Клік по мішені (+1 бал)
    target.addEventListener('click', (e) => {
      e.stopPropagation(); // Щоб клік не спрацьовував поза мішенню
      if (!isRunning) return;

      score++;
      scoreEl.textContent = score;
      moveTarget();
    });

    // Старт/Стоп по пробілу
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault(); // Запобігаємо прокручуванню сторінки

        if (timeLeft <= 0) {
          timeLeft = 30;
          startGame();
        } else if (isRunning) {
          pauseGame();
        } else {
          startGame();
        }
      }
    });
  </script>
</body>
</html>
